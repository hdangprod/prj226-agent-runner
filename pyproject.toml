[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prj226-runner"
version = "0.1.0"
description = "Deterministic local orchestration runner for PRJ226 AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prj226-runner = "prj226_runner.cli:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

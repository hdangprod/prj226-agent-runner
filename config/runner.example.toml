# Example configuration for prj226-agent-runner
# Readable via standard-library tomllib in Python >= 3.12

[runner]
runtime_root = "/tmp/prj226_agent_runner"

# Provider/model bindings are runner configuration, never Task Packet fields.
[agents.builder]
tool = "codex"
executable = "/usr/local/bin/codex"
model = "configured-by-operator"
timeout_seconds = 600

[agents.dv]
tool = "opencode2"
executable = "opencode"
model = "Muse"
timeout_seconds = 300

[agents.sos_reviewer]
tool = "codex"
executable = "/Users/dangnguyen/.nvm/versions/node/v20.5.0/bin/codex"
model = "gpt-5.6-luna"
timeout_seconds = 300
